
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: tp-reservas-keycloak

    command: start-dev

    ports:
      - "8080:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    volumes:
      - keycloak_data:/opt/keycloak/data

    restart: unless-stopped

volumes:
  keycloak_data:
